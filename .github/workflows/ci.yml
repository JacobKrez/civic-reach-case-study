# FoodPath CI — runs on every push and pull request.
#
# What this workflow guards:
#   1. The full pytest suite (deterministic guardrails, calculator, agent,
#      retrieval, web) must pass with no provider API keys present.
#   2. The deterministic red-team run must satisfy the adversarial thresholds:
#      crisis, injection, and false-positive categories at 100%, and overall
#      at least 90%. The in-process fake LLM avoids provider keys/API spend,
#      while production guardrails still execute before the fake client. Any
#      non-zero harness exit or Python traceback fails the build.
#   3. The W44 quality gate (scripts/gate.py + QUALITY_BAR.md) runs as the
#      final step so the entire bar — KB provenance, KB/calculator consistency,
#      README consistency, simulator invariants, cold-smoke verdict — is
#      enforced in CI as well. A red gate blocks the build.
#
# A separate manual workflow may run the same corpus against a live provider
# to produce model-specific evidence; CI itself remains deterministic.

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gate G4 can date the last change to src/.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Run pytest suite
        run: pytest -q

      - name: Red-team threshold gate (no LLM calls)
        run: |
          set +e
          python3 redteam/run_redteam.py --dry-run > redteam_dryrun.log 2>&1
          status=$?
          set -e
          tail -20 redteam_dryrun.log
          if [ $status -ne 0 ]; then
            echo "::error::red-team thresholds failed with status $status"
            exit $status
          fi
          if grep -q "Traceback" redteam_dryrun.log; then
            echo "::error::red-team dry-run produced a Python traceback"
            exit 1
          fi

      - name: W44 quality gate (final step; see QUALITY_BAR.md)
        run: |
          set +e
          python3 scripts/gate.py > gate.log 2>&1
          status=$?
          set -e
          tail -40 gate.log
          if [ $status -ne 0 ]; then
            echo "::error::quality gate failed with status $status"
            exit $status
          fi
          if grep -q "Traceback" gate.log; then
            echo "::error::quality gate produced a Python traceback"
            exit 1
          fi
